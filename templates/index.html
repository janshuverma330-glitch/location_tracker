
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Location Sharing</title>
</head>
<body>
    <h2>Share Your Live Location</h2>

    <p>
        If you choose to start, your location will be shared
        with the dashboard owner while sharing remains active.
    </p>

    <button id="start">Start Sharing</button>
    <button id="stop" disabled>Stop Sharing</button>
    <p id="status">Sharing is off.</p>

    <script>
        let watchId = null;

        const status = document.getElementById("status");
        const start = document.getElementById("start");
        const stop = document.getElementById("stop");

        async function sendLocation(position) {
            try {
                const response = await fetch("/location", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        latitude: position.coords.latitude,
                        longitude: position.coords.longitude,
                        sharing: true
                    })
                });

                if (!response.ok) {
                    throw new Error("Server error");
                }

                status.textContent = "Location shared and updating.";
            } catch (error) {
                status.textContent = "Could not send location. Try again.";
            }
        }

        start.addEventListener("click", () => {
            if (!navigator.geolocation) {
                status.textContent = "Geolocation is not supported.";
                return;
            }

            status.textContent = "Waiting for location permission...";

            navigator.geolocation.getCurrentPosition(
                position => {
                    sendLocation(position);

                    watchId = navigator.geolocation.watchPosition(
                        sendLocation,
                        () => {
                            status.textContent =
                                "Location unavailable. Check permission.";
                        },
                        {
                            enableHighAccuracy: true,
                            maximumAge: 0,
                            timeout: 15000
                        }
                    );

                    start.disabled = true;
                    stop.disabled = false;
                },
                () => {
                    status.textContent =
                        "Permission denied or location unavailable.";
                },
                {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 15000
                }
            );
        });

        stop.addEventListener("click", async () => {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }

            try {
                await fetch("/location", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ sharing: false })
                });
            } finally {
                status.textContent = "Sharing stopped.";
                start.disabled = false;
                stop.disabled = true;
            }
        });
    </script>
</body>
</html>
